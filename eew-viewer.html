<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>緊急地震速報ビューア</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#0e1116;--card:#171c24;--line:#262d38;--tx:#e8edf3;--mut:#8b96a5;--ok:#2ea043;--bad:#e5484d}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0}
.st{display:flex;gap:14px;font-size:12px;color:var(--mut)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:5px}
.dot.on{background:var(--ok)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;font-size:13px;align-items:center}
button{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
button:hover{border-color:var(--mut)}
.mut{color:var(--mut)}
.idle{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:36px 16px;text-align:center;color:var(--mut)}
.idle b{display:block;font-size:18px;color:var(--ok);margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;display:flex;gap:14px;align-items:center}
.card.warn{border-color:var(--bad);animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 3px rgba(229,72,77,.45)}}
.int{min-width:84px;text-align:center;border-radius:10px;padding:8px 6px}
.int small{display:block;font-size:11px;opacity:.8}
.int strong{font-size:30px;line-height:1.1}
.body{flex:1;min-width:0}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mut);margin-right:4px}
.tag.w{background:var(--bad);border-color:var(--bad);color:#fff}
.hyp{font-size:20px;font-weight:700;margin:2px 0}
.meta{font-size:13px;color:var(--mut)}
.cd{margin-top:6px;font-size:15px}
.cd b{font-size:22px}
h2{font-size:14px;color:var(--mut);margin:20px 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500}
#map{height:min(58vh,460px);border-radius:12px;border:1px solid var(--line);margin-bottom:6px;background:#dfe6ee;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut);margin-bottom:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.epi{font-size:26px;font-weight:900;color:#e5484d;text-align:center;line-height:28px;text-shadow:0 0 3px #fff,0 0 3px #fff}
footer{margin-top:24px;font-size:12px;color:var(--mut)}
@media(max-width:520px){.card{flex-direction:column;align-items:stretch}.int{align-self:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌏 緊急地震速報ビューア</h1>
    <div class="st">
      <span><i class="dot" id="d1"></i>Wolfx(気象庁EEW)</span>
      <span><i class="dot" id="d2"></i>P2P地震情報</span>
    </div>
  </header>

  <div class="bar">
    <span>現在地: <b id="me">東京(既定)</b></span>
    <button id="geo">現在地を使う</button>
    <button id="snd">🔔 音声通知: OFF</button>
    <button id="test">テスト表示</button>
  </div>

  <div id="map"></div>
  <div class="legend">
    <span><b style="color:#e5484d">✕</b> 震源</span>
    <span><i style="background:#e5484d"></i>S波(主要動)</span>
    <span><i style="background:#1d6fe0"></i>P波(初期微動)</span>
    <span><i style="background:#1d6fe0;border:2px solid #fff;box-shadow:0 0 0 1px #1d6fe0"></i>現在地</span>
  </div>
  <div id="active"></div>

  <h2>最近の速報</h2>
  <table>
    <thead><tr><th>発生時刻</th><th>震源</th><th>M</th><th>深さ</th><th>最大震度</th><th>報</th></tr></thead>
    <tbody id="hist"></tbody>
  </table>

  <footer>
    ⚠ 非公式の表示ツールです。通信遅延や欠落があり得るため、身の安全はテレビ・スマホ標準の緊急地震速報や防災アプリなど公式の手段で確保してください。<br>
    データ提供: Wolfx API / P2P地震情報 / 地図: 地理院タイル(国土地理院)。到達時間は現在地と震源の距離からの概算(P波7km/s・S波4km/s)で、実際の揺れ方とは異なります。
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = {lat:35.68, lon:139.77};
let sound = false, actx = null;
const events = new Map();

const COL = {'1':['#f2f2ff','#222'],'2':['#00aaff','#fff'],'3':['#0041ff','#fff'],'4':['#fae696','#222'],
  '5弱':['#ffe600','#222'],'5強':['#ff9900','#222'],'6弱':['#ff2800','#fff'],'6強':['#a50021','#fff'],'7':['#b40068','#fff']};
const SC = {10:'1',20:'2',30:'3',40:'4',45:'5弱',50:'5強',55:'6弱',60:'6強',70:'7'};

const toDate = s => { const d = new Date(String(s).replace(/\//g,'-').replace(' ','T').replace(/\..*$/,'') + '+09:00'); return isNaN(d) ? null : d; };

function norm_wolfx(d){
  if(!d || !d.EventID) return null;
  return { id:String(d.EventID), serial:+d.Serial||0, warn:!!d.isWarn, final:!!d.isFinal, cancel:!!d.isCancel, test:!!d.isTraining,
    name:d.Hypocenter||'不明', lat:+d.Latitude, lon:+d.Longitude, mag:d.Magunitude, depth:+d.Depth||10,
    maxInt:d.MaxIntensity||'', origin:toDate(d.OriginTime), src:'Wolfx' };
}
function norm_p2p(d){
  if(!d || d.code !== 556 || !d.earthquake) return null;
  const h = d.earthquake.hypocenter || {};
  const sc = (d.areas||[]).map(a => a.scaleTo).filter(x => x > 0);
  return { id:String(d.issue?.eventId || d.id), serial:+d.issue?.serial||0, warn:true, final:false, cancel:!!d.cancelled, test:!!d.test,
    name:h.name||'不明', lat:+h.latitude, lon:+h.longitude, mag:h.magnitude, depth:+h.depth||10,
    maxInt: sc.length ? (SC[Math.max(...sc)]||'') : '', origin:toDate(d.earthquake.originTime), src:'P2P' };
}

function ingest(ev){
  if(!ev) return;
  const old = events.get(ev.id);
  if(old && old.serial > ev.serial) return;
  if(old && old.serial === ev.serial && old.src !== ev.src){ old.warn = old.warn || ev.warn; if(!old.maxInt) old.maxInt = ev.maxInt; render(); return; }
  events.set(ev.id, ev);
  if(!old && ev.origin && Date.now() - ev.origin < 120000 && !ev.cancel) beep();
  render();
}

function km(a,b,c,d){
  const R=6371, r=Math.PI/180, dl=(c-a)*r, dn=(d-b)*r;
  const x=Math.sin(dl/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dn/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function arrival(ev){
  if(!ev.origin || isNaN(ev.lat)) return null;
  const r = Math.hypot(km(me.lat,me.lon,ev.lat,ev.lon), ev.depth);
  return { dist:r, p:ev.origin.getTime() + r/7*1000, s:ev.origin.getTime() + r/4*1000 };
}
function badge(i){
  const c = COL[i] || ['#39414d','#fff'];
  return `<div class="int" style="background:${c[0]};color:${c[1]}"><small>最大震度</small><strong>${esc(i||'?')}</strong></div>`;
}
const fmt = d => d ? d.toLocaleString('ja-JP',{hour12:false,timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '-';

function isActive(ev){ return !ev.cancel && ev.origin && Date.now() - ev.origin < 150000; }

function render(){
  const list = [...events.values()].sort((a,b) => (b.origin||0) - (a.origin||0));
  const act = list.filter(isActive);
  $('#active').innerHTML = act.length ? act.map(ev => {
    const a = arrival(ev);
    return `<div class="card ${ev.warn?'warn':''}" data-id="${esc(ev.id)}">${badge(ev.maxInt)}
      <div class="body">
        <div>${ev.warn?'<span class="tag w">警報</span>':'<span class="tag">予報</span>'}${ev.final?'<span class="tag">最終報</span>':''}${ev.test?'<span class="tag">訓練/テスト</span>':''}<span class="tag">第${ev.serial}報</span><span class="tag">${esc(ev.src)}</span></div>
        <div class="hyp">${esc(ev.name)}</div>
        <div class="meta">M${esc(ev.mag)} / 深さ ${esc(ev.depth)}km / 発生 ${fmt(ev.origin)}</div>
        <div class="cd" data-cd="${esc(ev.id)}">${a ? '' : ''}</div>
      </div></div>`;
  }).join('') : `<div class="idle"><b>● 受信待機中</b>現在、発表中の緊急地震速報はありません</div>`;

  syncMap(act);
  $('#hist').innerHTML = list.slice(0,10).map(ev =>
    `<tr><td>${fmt(ev.origin)}</td><td>${esc(ev.name)}${ev.cancel?'(取消)':''}</td><td>${esc(ev.mag)}</td><td>${esc(ev.depth)}km</td><td>${esc(ev.maxInt||'-')}</td><td>${ev.serial}${ev.final?'(最終)':''}</td></tr>`
  ).join('') || '<tr><td colspan="6" class="mut">まだ受信していません</td></tr>';
  tick();
}

function tick(){
  updateWaves();
  document.querySelectorAll('[data-cd]').forEach(el => {
    const ev = events.get(el.dataset.cd); const a = ev && arrival(ev); if(!a) return;
    const s = (a.s - Date.now())/1000, p = (a.p - Date.now())/1000;
    const dist = Math.round(a.dist);
    el.innerHTML = s > 0
      ? `あなたの場所(震源から約${dist}km): S波(主要動)到達まで <b>${Math.ceil(s)}</b> 秒` + (p > 0 ? ` <span class="mut">(P波まで${Math.ceil(p)}秒)</span>` : '')
      : `あなたの場所(約${dist}km)は S波が到達済みと推定されます`;
  });
 
}
setInterval(tick, 250);
setInterval(() => { if(events.size) render(); }, 10000);

function beep(){
  if(!sound || !actx) return;
  [0,0.25,0.5].forEach(t => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 1000; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.15, actx.currentTime + t); g.gain.setValueAtTime(0, actx.currentTime + t + 0.18);
    o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 0.2);
  });
}

function connect(url, onmsg, dot, ping){
  const open = () => {
    let ws, timer;
    try { ws = new WebSocket(url); } catch(e){ setTimeout(open, 8000); return; }
    ws.onopen = () => { dot(true); if(ping) timer = setInterval(() => ws.readyState === 1 && ws.send('ping'), 30000); };
    ws.onclose = () => { dot(false); clearInterval(timer); setTimeout(open, 5000); };
    ws.onerror = () => ws.close();
    ws.onmessage = e => { try { onmsg(JSON.parse(e.data)); } catch(_){} };
  };
  open();
}
connect('wss://ws-api.wolfx.jp/jma_eew', d => ingest(norm_wolfx(d)), on => $('#d1').classList.toggle('on', on), true);
connect('wss://api.p2pquake.net/v2/ws', d => ingest(norm_p2p(d)), on => $('#d2').classList.toggle('on', on), false);

$('#snd').onclick = () => {
  sound = !sound;
  if(sound){ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); beep(); }
  $('#snd').textContent = '🔔 音声通知: ' + (sound ? 'ON' : 'OFF');
};
$('#geo').onclick = () => {
  if(!navigator.geolocation) return alert('位置情報に対応していません');
  navigator.geolocation.getCurrentPosition(p => {
    me = {lat:p.coords.latitude, lon:p.coords.longitude};
    $('#me').textContent = `${me.lat.toFixed(2)}, ${me.lon.toFixed(2)}`;
    if(meMarker) meMarker.setLatLng([me.lat, me.lon]);
    render();
  }, () => alert('位置情報を取得できませんでした'));
};
$('#test').onclick = () => {
  ingest({ id:'TEST'+Date.now(), serial:1, warn:true, final:false, cancel:false, test:true, name:'能登半島沖(テスト)',
    lat:37.5, lon:137.3, mag:'6.5', depth:10, maxInt:'5強', origin:new Date(Date.now()-3000), src:'TEST' });
};
let map = null, meMarker = null;
const layers = new Map();
function initMap(){
  if(typeof L === 'undefined'){ $('#map').innerHTML = '<div class="idle">地図ライブラリを読み込めませんでした(ネット接続を確認してください)</div>'; return; }
  map = L.map('map', {minZoom:4, maxZoom:12}).setView([36.5, 137.5], 5);
  L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
    maxZoom:18, attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>'
  }).addTo(map);
  meMarker = L.circleMarker([me.lat, me.lon], {radius:6, color:'#fff', weight:2, fillColor:'#1d6fe0', fillOpacity:1}).addTo(map).bindTooltip('現在地');
}
function syncMap(act){
  if(!map) return;
  const ids = new Set(act.map(e => e.id));
  for(const [id, l] of layers){ if(!ids.has(id)){ map.removeLayer(l.g); layers.delete(id); } }
  act.forEach(ev => {
    if(isNaN(ev.lat) || isNaN(ev.lon)) return;
    const ll = [ev.lat, ev.lon];
    let l = layers.get(ev.id);
    if(!l){
      const g = L.layerGroup().addTo(map);
      const s = L.circle(ll, {radius:0, color:'#e5484d', weight:2, fillColor:'#e5484d', fillOpacity:.15}).addTo(g);
      const p = L.circle(ll, {radius:0, color:'#1d6fe0', weight:2, fillColor:'#1d6fe0', fillOpacity:.06, dashArray:'5 5'}).addTo(g);
      const m = L.marker(ll, {icon:L.divIcon({className:'epi', html:'✕', iconSize:[28,28], iconAnchor:[14,14]})}).addTo(g);
      l = {g, s, p, m, ev}; layers.set(ev.id, l);
      map.flyTo(ll, Math.max(map.getZoom(), 6), {duration:0.8});
    } else {
      l.s.setLatLng(ll); l.p.setLatLng(ll); l.m.setLatLng(ll); l.ev = ev;
    }
    l.m.bindTooltip(`${ev.name} M${ev.mag} 最大震度${ev.maxInt || '-'}`);
  });
}
function updateWaves(){
  if(!map) return;
  const now = Date.now();
  for(const l of layers.values()){
    const t = (now - l.ev.origin) / 1000;
    const surf = v => { const r = v * t, d = l.ev.depth; return r > d ? Math.sqrt(r*r - d*d) * 1000 : 0; };
    l.p.setRadius(surf(7)); l.s.setRadius(surf(4));
  }
}
initMap();
render();
</script>
</body>
</html>
